name: Deploy release branch to Cloudflare Pages

on:
  push:
    branches:
      - release
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-pages
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

env:
  CF_PAGES_PROJECT: egor-website

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Served from the domain root (https://egor.website/). No 404.html is emitted,
      # so Cloudflare Pages answers unknown paths with index.html (SPA mode).
      - name: Build project
        run: npm run build

      - name: Ensure Pages project exists
        run: npx --yes wrangler pages project create "$CF_PAGES_PROJECT" --production-branch=release || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy dist --project-name=${{ env.CF_PAGES_PROJECT }} --branch=release --commit-dirty=true
